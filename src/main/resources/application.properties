spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/hirepoint}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:your_local_password}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
logging.file.name=logs/hirepoint.log
logging.level.com.begli.hirepoint=INFO
jwt.secret=${JWT_SECRET:this-is-a-placeholder-secret-key-change-this-later-12345}